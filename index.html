<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bisong Best — Selected Systems & Architectures</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Animation -->
    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Animated Background -->
    <div class="animated-bg" id="animatedBg"></div>
    
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Back to Top Button -->
    <div class="back-to-top" id="backToTop">
        <i class="fas fa-chevron-up"></i>
    </div>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

    <!-- Header & Navigation Mount -->
    <header id="header" class="header-mount"></header>

    <!-- Hero Section Mount -->
    <section id="home" class="hero hero-mount"></section>

    <!-- About Section Mount -->
    <section id="about" class="section reveal about-mount"></section>

    <!-- Services Section Mount -->
    <section id="services" class="section services reveal services-mount"></section>

    <!-- Process Section Mount -->
    <section id="process" class="section reveal process-mount"></section>

    <!-- Projects Section Mount -->
    <section id="projects" class="section reveal projects-mount"></section>

    <!-- Contributions Section Mount -->
    <section id="contributions" class="section reveal contributions-mount"></section>

    <!-- Contact Section Mount -->
    <section id="contact" class="section reveal contact-mount"></section>

    <!-- Footer Mount -->
    <footer id="footer-mount"></footer>

    <!-- Terminal Console Mount -->
    <div id="terminal-mount"></div>

    <!-- Main Module Script -->
    <script type="module" src="dist/main.js"></script>
</body>
</html>
